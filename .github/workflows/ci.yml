name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # macOS runner, so the same tests also run on the iOS simulator, not just the JVM.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests on JVM + iOS simulator
        run: ./gradlew allTests
      - name: Mutation check (hand-written suite must kill every mutant)
        run: ./llm-eval/run-eval.sh | tee eval.txt && grep -q "Mutants killed: 3/3" eval.txt
